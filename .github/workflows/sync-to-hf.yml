name: sync-to-hf
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: huggingface/hub-sync@v0.3.0
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: gw0/jobfit-jevbench
          hf_token: ${{ secrets.HF_TOKEN }}
          repo_type: dataset
